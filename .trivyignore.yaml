# Trivy ignore list for the release gate (.github/workflows/release.yml,
# `trivyignores: .trivyignore.yaml`). Keep this file even when empty: the
# workflow passes it explicitly.
#
# Policy for new entries: only for findings that are genuinely not
# reachable in meshmon's images, each with a `statement` explaining why,
# the narrowest `paths` that apply, and an `expired_at` at most ~90 days
# out so the entry is re-checked against upstream fixes. Prefer bumping
# the base image when a fixed release exists.
