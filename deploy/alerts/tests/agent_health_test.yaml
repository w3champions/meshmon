# vmalert-tool unit tests for meshmon.agent_health group.
#
# Note: vmalert-tool v1.153.0 requires `groupname` on every alert_rule_test
# block and automatically injects an `alertgroup` label equal to the group name.
#
# vmalert-tool's synthetic clock starts at 2000-01-01T00:00:00Z
# (946684800) since v1.148.0 — it was epoch 0 before; see
# VictoriaMetrics#11219 / #11437. The series is pinned to that start
# timestamp so `time() - last_seen` equals the elapsed test time: it
# crosses the 300s threshold after eval_time 5m and, with `for: 2m`, the
# alert fires from ~8m on. If a future vmalert-tool moves the clock
# origin again, update the series value to match.
#
# The AgentOffline metric has only `source` — no target or protocol.
# The `description` annotation renders via `printf "%.0f"` so at eval_time
# 10m (600s), the value is "600" seconds.
rule_files:
  - ../rules.yaml

evaluation_interval: 60s

tests:
  # --- AgentOffline fires when agent stops pushing ---------------------------
  # Series flat at the test start timestamp simulates last_seen frozen
  # when the test begins. At eval_time 6m (360s > 300) the rule is only
  # pending (for: 2m), so nothing fires yet. At eval_time 10m:
  # 600 > 300 ✓ and pending since 6m ✓.
  - interval: 60s
    input_series:
      - series: 'meshmon_agent_last_seen_seconds{source="a"}'
        values: '946684800+0x20'
    alert_rule_test:
      - eval_time: 6m
        groupname: meshmon.agent_health
        alertname: AgentOffline
        exp_alerts: []
      - eval_time: 10m
        groupname: meshmon.agent_health
        alertname: AgentOffline
        exp_alerts:
          - exp_labels:
              alertgroup: meshmon.agent_health
              severity: warning
              category: agent
              source: a
            exp_annotations:
              summary: 'Agent a has not reported in > 5 min'
              description: 'Seconds since last push: 600'
